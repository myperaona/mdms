version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: mdms-db
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=mdms_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdms_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./mdms-backend
      dockerfile: Dockerfile
    container_name: mdms-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/mdms_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=dGhpc2lzYWJlYXV0aWZ1bHNlY3JldGtleWZvcm1kbXNhcHBsaWNhdGlvbnNlY3VyZQ==
    volumes:
      - ./drivers:/app/drivers
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./mdms-frontend
      dockerfile: Dockerfile
    container_name: mdms-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
