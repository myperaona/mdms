spring:
  application:
    name: mdms-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mdms_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.antigravity.mdms.model
  type-handlers-package: com.antigravity.mdms.config
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET:dGhpc2lzYWJlYXV0aWZ1bHNlY3JldGtleWZvcm1kbXNhcHBsaWNhdGlvbnNlY3VyZQ==}
  expiration: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: INFO
    com.antigravity.mdms: DEBUG
    org.mybatis: DEBUG
